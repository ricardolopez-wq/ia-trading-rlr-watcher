services:
  - type: cron
    name: ia-trading-rlr-watcher
    runtime: node
    schedule: "*/5 * * * 1-5"
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ALPACA_PAPER_API_KEY
        sync: false
      - key: ALPACA_PAPER_SECRET_KEY
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: ALERT_WEBHOOK_SECRET
        sync: false
      - key: SITES_BYPASS_TOKEN
        sync: false
